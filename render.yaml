# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Defines the BazarHQ API web service. This repo is an npm-workspaces monorepo,
# so install/build run from the repo root (where `@bazarhq/shared` is linked)
# and the build/start scripts are scoped to the `api` workspace.
services:
  - type: web
    name: bazarhq-api
    runtime: node
    rootDir: .
    # Root install links workspaces (incl. @bazarhq/shared), then the api build
    # runs `prisma generate && tsc`.
    buildCommand: npm install && npm run build --workspace=api
    startCommand: npm run start --workspace=api
    healthCheckPath: /health
    envVars:
      # Required so cookies use Secure + SameSite=None cross-site and the build
      # behaves as production. Render does NOT set this automatically.
      - key: NODE_ENV
        value: production
      # PORT is injected automatically by Render — do not declare it here.

      # --- Database (Supabase / Postgres, used by Prisma) ---
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # --- Auth & crypto secrets ---
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false

      # --- Frontend origin (CORS + email links) ---
      - key: FRONTEND_URL
        sync: false

      # --- Image CDN (Cloudinary) ---
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # --- Cache / rate-limit (Upstash Redis) ---
      # NOT optional in production. With no reachable Redis the app does not
      # fail — it silently drops admin TOTP two-factor, the admin inactivity
      # timeout, merchant + admin brute-force lockout, every rate limiter, and
      # the daily email quota. GET /v1/admin/system/health reports which guards
      # are live.
      #
      # Copy both straight from the Upstash console. The URL must be the HTTPS
      # REST endpoint (https://<id>.upstash.io) — the rediss:// string on the
      # same page will not work; @upstash/redis speaks REST over 443.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Older aliases, still read if the REST-named pair above is absent.
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_TOKEN
        sync: false

      # --- Email: transport selection (Sprint 0, design doc §2.5) ---
      # "brevo" (ACTIVE, default) | "smtp" (dormant) | "resend" (dormant).
      # Three swappable providers; switching is this variable, no code change.
      # Set this to "brevo".
      - key: EMAIL_PROVIDER
        sync: false

      # --- Email: Brevo transactional API (ACTIVE transport) ---
      # HTTPS on 443. This is the only transport that works here: Render's free
      # tier blocks outbound SMTP entirely (ports 25/465/587) as of Sept 2025,
      # per Render's changelog — which is why the SMTP block below is dormant.
      # The sender must be a VERIFIED sender in Brevo; an unverified one is
      # rejected at send time as a 400, not at configuration time.
      - key: BREVO_API_KEY
        sync: false
      # Optional. The sender falls back to SMTP_FROM_EMAIL / SMTP_FROM_NAME
      # below, so these only need setting if the two must differ.
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false

      # --- Email: Gmail SMTP (DORMANT — unreachable from Render's free tier) ---
      # Kept intact and selectable with EMAIL_PROVIDER=smtp on a paid instance,
      # where outbound SMTP is permitted. SMTP_FROM_NAME / SMTP_FROM_EMAIL are
      # still read under the Brevo transport as the sender fallback.
      # SMTP_PASS is a Google App Password — 16 chars, requires 2-Step
      # Verification on the account. It is NOT scoped to sending: a leaked one
      # also reads the mailbox over IMAP. Enter it in the dashboard only, never
      # in the repo, and rotate immediately if exposed.
      - key: SMTP_HOST
        sync: false
      # 587 (STARTTLS) is the default and the proven value on Render: outbound
      # 465 is blocked here and times out at connect. 465 = implicit TLS, for a
      # host where it is open. The transport also forces an IPv4 connection —
      # Render has no outbound IPv6 route and smtp.gmail.com has AAAA records.
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false

      # --- Email: staged rollout + quota guard ---
      # OFF for Sprint 0. The four order/merchant senders have never delivered a
      # message in production; this keeps them from all firing at once and
      # eating the shared 300/day Brevo quota that the OTP path depends on.
      # Flip to "true" deliberately once OTP is proven. (Password reset and OTP
      # are NOT gated by this.)
      - key: TRANSACTIONAL_EMAIL_ENABLED
        sync: false
      # Optional. Defaults to 300 — Brevo's free transactional allowance, so our
      # counter trips with a clean EMAIL_UNAVAILABLE before Brevo refuses. Raise
      # it on a paid Brevo plan, or set 450 when running the SMTP transport.
      - key: EMAIL_DAILY_QUOTA
        sync: false

      # --- Email (Resend) — DORMANT, kept declared and empty (§2.5) ---
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

      # --- Used only by the one-off `npm run seed:admin` script ---
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
